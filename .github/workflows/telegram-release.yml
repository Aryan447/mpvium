name: Telegram Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          # Prefer the universal APK so Telegram gets a single installable file.
          # gh fails fast with a clear error when nothing matches.
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "mpvium-universal-*.apk" \
            --dir release \
            --clobber
          APK_PATH=$(ls release/mpvium-universal-*.apk | head -1)
          ls -lh "$APK_PATH"
          test -s "$APK_PATH"
          sha256sum "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Public destination: https://t.me/mpvium/16 (topic/thread 16).
          CHAT_ID: "@mpvium"
          THREAD_ID: "16"
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          ls -lh "${APK_PATH}"
          test -s "${APK_PATH}"
          # Telegram caption limit is 1024 chars; keep tag + truncated notes.
          CAPTION=$(printf 'New release: %s\n\n%s' "$TAG" "$NOTES" | cut -c1-1000)
          curl -sSL -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "message_thread_id=${THREAD_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=${CAPTION}"
