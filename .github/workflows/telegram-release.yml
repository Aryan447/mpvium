name: Telegram Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          # Prefer arm64 (fits Telegram's 50MB Bot API upload limit; the
          # universal APK is ~80MB and would always be rejected).
          # gh fails fast with a clear error when nothing matches.
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "mpvium-arm64-v8a-*.apk" \
            --dir release \
            --clobber
          APK_PATH=$(ls release/mpvium-arm64-v8a-*.apk | head -1)
          ls -lh "$APK_PATH"
          test -s "$APK_PATH"
          sha256sum "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Public destination: https://t.me/mpvium/16 (topic/thread 16).
          CHAT_ID: "@mpvium"
          THREAD_ID: "16"
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          ls -lh "${APK_PATH}"
          test -s "${APK_PATH}"
          # Telegram caption limit is 1024 chars; keep tag + truncated notes.
          CAPTION=$(printf 'New release: %s\n\n%s' "$TAG" "$NOTES" | cut -c1-1000)
          stat "$APK_PATH"
          # Feed the file via stdin (@-): curl's own file open() fails on
          # this runner despite the file being present and readable, while
          # shell redirection reads it fine.
          APK_FILENAME=$(basename "$APK_PATH")
          if ! curl -sSL -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "message_thread_id=${THREAD_ID}" \
            -F "document=@-;filename=${APK_FILENAME};type=application/vnd.android.package-archive" \
            -F "caption=${CAPTION}" < "$APK_PATH"; then
            echo "--- upload failed, dumping curl trace ---"
            curl --trace-ascii /tmp/curl-trace.txt -X POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "message_thread_id=${THREAD_ID}" \
              -F "document=@-;filename=${APK_FILENAME};type=application/vnd.android.package-archive" \
              -F "caption=${CAPTION}" < "$APK_PATH" || true
            tail -40 /tmp/curl-trace.txt || true
            exit 1
          fi
