name: CI Build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build standard release APKs and bundle
        # Single Gradle invocation: one daemon + one configuration phase
        # instead of paying JVM startup/configure costs twice.
        # -PbundleBuild disables ABI splits for the bundle step
        # (see app/build.gradle.kts); AGP fails bundle builds otherwise.
        # -PciFastBuild: arm64-v8a + universal only, no R8/shrinking.
        # CI artifacts are larger but installable; production releases
        # (release.yml) are unaffected and still build all ABIs minified.
        # lintVital is skipped for speed; re-add if release lint gate needed.
        run: ./gradlew assembleStandardRelease bundleStandardRelease --parallel -x lintVitalStandardRelease -PciDebugSigning -PbundleBuild -PciFastBuild

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-release-bundle-ci-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/bundle/standardRelease/app-standard-release.aab
          if-no-files-found: warn

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-release-apks-ci-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: warn
