name: CI/CD Build

on:
  # push:
  #   branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleStandardRelease -PciDebugSigning

      - name: Build bundles with Gradle
        run: ./gradlew bundleStandardRelease bundlePlaystoreRelease -PciDebugSigning

      - name: Upload standard bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-release-bundle-ci-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/bundle/standardRelease/app-standard-release.aab
          if-no-files-found: warn
      - name: Upload playstore bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-playstore-release-bundle-ci-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab
          if-no-files-found: warn

      - name: Upload app-arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-arm64-v8a-release-ci-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release.apk
          if-no-files-found: warn
      - name: Upload app-armeabi-v7a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-armeabi-v7a-release-ci-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-armeabi-v7a-release.apk
          if-no-files-found: warn
      - name: Upload app-universal Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-universal-release-ci-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-universal-release.apk
          if-no-files-found: warn
      - name: Upload app-x86 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-x86-release-ci-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-x86-release.apk
          if-no-files-found: warn
      - name: Upload app-x86_64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-x86_64-release-ci-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-x86_64-release.apk
          if-no-files-found: warn
