# Robolectric configuration for JVM unit tests.
#
# Use API 34 because it is the newest level that runs on the CI JDK 17
# (API 35+ requires Java 21, see Robolectric's compatibility table).
#
# Use a plain Application instead of the app's App class so that
# App.onCreate() does not start Koin, open Room, or initialize the native
# mpv thumbnail bridge in a JVM test process.
sdk=34
application=android.app.Application
